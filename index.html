<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>BrightPath AI</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
:root{
--indigo-900:#1f3785;
--indigo-700:#2854d9;
--indigo-600:#3a64ed;
--indigo-500:#5c80f6;
--sky-100:#e9f9fe;
--lavender:#f2eefb;
--amber-500:#f5ab0b;
--amber-400:#fbbf24;
--coral:#fb7185;
--teal:#14b8a6;
--green:#22c55e;
--ink:#241b3d;
--ink-soft:#6b6584;
--white:#ffffff;
--card-radius:20px;
--shadow-soft: 0 10px 30px -12px rgba(76,29,149,0.25);
--font-display:'Baloo 2', system-ui, sans-serif;
--font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: linear-gradient(135deg, var(--indigo-900) 0%, var(--indigo-600) 35%, var(--sky-100) 100%);
    min-height: 100vh;
}
h1, h2, h3, h4 {font-family: var(--font-display);margin: 0;letter-spacing: 0.2px;}
p{margin: 0;}
button{font-family: var(--font-body);cursor: pointer; border: none;}
::selection{background: var(--indigo-500);color: var(--white);}

#app{max-width: 1180px;margin: 0 auto;padding: 28px 20px 60px;}

.brand{display: flex;align-items: center;gap: 10px; justify-content: center;margin-bottom: 6px;}
.brand .mark svg{
    width: 38px;height: 38px; border-radius: 12px;background: var(--indigo-500);padding: 6px;display:flex;align-items: center;justify-content: center;box-shadow: var(--shadow-soft);}
.brand .mark svg {width: 22px;height: 22px;}
.brand-word{font-family: var(--font-display);font-size: 26px;font-weight: 600;}
.brand-word .bright{color: var(--indigo-500);}
.brand-word .path{color: var(--amber-500);}
.tagline{font-size: 14px;color: var(--ink-soft);text-align: center;margin-bottom: 20px;font-weight: 500;}
.auth-wrap{
    display: none; 
    max-width: 920px; margin:0 auto;
    background: var(--white); border-radius: 28px;
    box-shadow: var(--shadow-soft); padding: 40px 30px;
    overflow: hidden;
    grid-template-columns: 1fr 1fr;
}
.auth-wrap.activity {display: grid;}
@media (max-width: 760px) {
    .auth-wrap.activity {grid-template-columns: 1fr;} .auth-side{display: none;}
}

.auth-side{
    background:
    radial-gradient(50% 50% at 50% 50%, var(--indigo-500) 0%, var(--indigo-600) 100%, transparent 60%),
    linear-gradient(180deg, var(--indigo-500) 0%, var(--indigo-600) 100%);
    color:white;padding: 40px 30px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px;
}

.auth-side .stars span{position: absolute;opacity: 0.5;}
.auth-side h3{font-size: 22px;margin-bottom: 10px;line-height: 1.25;}
.auth-side p{color:white;font-size: 14px;line-height: 1.5;}
.auth-side .feat-list{margin-top: 20px;display: flex;flex-direction: column;gap: 12px;}
.auth-side .feat-list div{display: flex;align-items: center;gap: 10px;font-size: 14px;font-weight: 500;}
.auth-side .feat-list .ico{width: 20px;height: 20px;display: flex;align-items: center;justify-content: center;border-radius: 6px;background: var(--indigo-500);}
